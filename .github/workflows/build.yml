name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Build executable
        run: pyinstaller --noconfirm --onefile --windowed --name "XEMU.Redump.Repair.2.0.0" --icon assets\XemuRepair.ico xemu_redump_repair.pyw

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: XEMU.Redump.Repair.2.0.0
          path: dist/XEMU.Redump.Repair.2.0.0.exe
